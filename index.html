<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>心有靈排</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="心有靈排：排出你的真心，猜中朋友的腦袋。2–10 人的排名派對遊戲。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Huninn&family=Monoton&display=swap">
<style>
/* Layout: one centered phone column (max 560px). Concept: a night-market neon signboard — quiet dark enamel panels, and the only thing that glows is what matters: the logo sign, the topic lightbox, and tier rows that light up as they fill or get revealed. Single committed dark look. */
:root{
  --night:#110b22; --panel:#1b1434; --panel2:#241b44; --well:#140e29; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#f4f0ff; --muted:#a99cc9; --soft:#7f73a3; --ink:#1a1230; --box:#fbf8ff; --boxmuted:#6e6290;
  --S:#ff3d7f; --A:#ff8a2b; --B:#ffd02e; --C:#2ee6a0; --D:#3fbcff;
  --hit:#2ee6a0; --near:#ffd02e; --miss:#ff5470; --gold:#ffd02e;
  --f-ui:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-tier:"Monoton","Bungee","Arial Black",Impact,sans-serif;
  --f-num:"Bungee","Arial Black",Impact,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --lift:0 1px 0 rgba(255,255,255,.06) inset,0 18px 40px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(255,61,127,.20),transparent 60%),radial-gradient(80% 50% at 110% 40%,rgba(63,188,255,.10),transparent 60%),radial-gradient(70% 40% at -10% 90%,rgba(255,208,46,.08),transparent 60%);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px);background-size:24px 24px;mask-image:linear-gradient(#000,transparent 70%)}
button,input,textarea{font:inherit;color:inherit}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:8px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;min-height:48px}
.top .brand{font-size:18px;background:none;border:0;padding:4px 0;cursor:pointer;letter-spacing:.06em;color:var(--text);text-shadow:0 0 12px rgba(255,61,127,.55)}
.top .brand b{color:var(--S);font-weight:400}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);font-size:14px;white-space:nowrap;color:var(--muted)}
.pill.code{font-family:var(--f-num);letter-spacing:.14em;color:var(--B);border-color:rgba(255,208,46,.35)}
.pill.x2{color:var(--night);background:var(--gold);border-color:var(--gold);font-weight:700}
.iconbtn{width:42px;height:42px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line2);cursor:pointer;font-size:18px;display:grid;place-items:center}

/* surfaces */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--lift);padding:18px}
.card h2,.card h3{margin:0}
.card h2{font-size:24px}
.card h3{font-size:18px}
.muted{color:var(--muted)}
.dim{color:var(--soft)}
h1,h2,h3{text-wrap:balance;line-height:1.25;font-weight:400}
b,strong{font-weight:400;color:var(--text)}

/* buttons */
.btn{appearance:none;border:1px solid var(--line2);border-radius:var(--r-md);padding:12px 18px;font-size:17px;cursor:pointer;background:var(--panel2);color:var(--text);transition:transform .08s,box-shadow .2s,filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;letter-spacing:.02em}
.btn:active:not(:disabled){transform:translateY(2px) scale(.99)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none!important}
.btn.big{font-size:20px;padding:15px 20px;width:100%;min-height:58px;border-radius:18px}
.btn.pink{background:linear-gradient(180deg,#ff5a92,#ff2f74);border-color:#ff8ab2;color:#fff;box-shadow:0 0 0 1px rgba(255,61,127,.3),0 10px 30px -8px rgba(255,61,127,.7),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(120,0,40,.35)}
.btn.yellow{background:linear-gradient(180deg,#ffe066,#ffc81f);border-color:#fff0a8;color:var(--ink);box-shadow:0 10px 30px -10px rgba(255,208,46,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.mint{background:linear-gradient(180deg,#5ff0b8,#22d892);border-color:#a8ffd9;color:var(--ink);box-shadow:0 10px 30px -10px rgba(46,230,160,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.blue{background:linear-gradient(180deg,#6fd0ff,#2aaef5);border-color:#b5e7ff;color:var(--ink);box-shadow:0 10px 30px -10px rgba(63,188,255,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line2)}
.btn.small{font-size:15px;padding:8px 14px;min-height:42px}
:focus-visible{outline:2px solid var(--B);outline-offset:3px}
.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:12px}
.err{color:var(--miss);margin:0;overflow-wrap:anywhere}
label.lb,span.lb{font-size:14px;color:var(--muted);display:block;margin-bottom:8px}
.in{width:100%;border:1px solid var(--line2);border-radius:var(--r-md);padding:10px 14px;background:var(--well);color:var(--text);font-size:18px;min-height:50px;transition:border-color .2s,box-shadow .2s}
.in::placeholder{color:var(--soft)}
.in:focus{outline:none;border-color:var(--S);box-shadow:0 0 0 3px rgba(255,61,127,.25)}
textarea.in{min-height:120px;resize:vertical;line-height:1.55}
.in.code{font-family:var(--f-num);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:22px}

/* hero: the neon sign */
.hero{text-align:center;padding:22px 0 2px}
.logo{font-size:clamp(52px,16vw,82px);margin:0;letter-spacing:.06em;line-height:1.1;font-weight:400;color:#fff4fa;
  text-shadow:0 0 4px #fff,0 0 14px var(--S),0 0 34px var(--S),0 0 70px rgba(255,61,127,.6);animation:flicker 2.8s linear 1 both}
.logo .k{display:inline-block}
.logo .k:nth-child(2){transform:translateY(-3px)}
.logo .k:nth-child(4){color:#fffbe6;text-shadow:0 0 4px #fff,0 0 14px var(--gold),0 0 34px var(--gold),0 0 70px rgba(255,208,46,.55);animation:hum 3.2s ease-in-out 2.8s infinite}
@keyframes flicker{0%,8%{opacity:.15}9%{opacity:1}11%{opacity:.3}13%,30%{opacity:1}31%{opacity:.55}33%,100%{opacity:1}}
@keyframes hum{50%{transform:rotate(-4deg) scale(1.06)}}
.tag{margin:10px 0 0;color:var(--muted);font-size:17px;letter-spacing:.08em}
.demo{display:grid;gap:8px;margin:20px auto 0;max-width:330px;text-align:left}
.demo div{display:grid;grid-template-columns:46px 1fr;align-items:center;gap:10px}
.demo b{font-family:var(--f-tier);font-size:22px;text-align:center;line-height:40px;border-radius:var(--r-sm);background:var(--well);border:1px solid currentColor}
.demo b.t0{color:var(--S);text-shadow:0 0 10px var(--S);box-shadow:0 0 14px -4px var(--S)}
.demo b.t1{color:var(--A);text-shadow:0 0 10px var(--A);box-shadow:0 0 14px -4px var(--A)}
.demo b.t4{color:var(--D);text-shadow:0 0 10px var(--D);box-shadow:0 0 14px -4px var(--D)}
.demo span{background:var(--box);color:var(--ink);border-radius:var(--r-sm);padding:6px 14px}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.av{font-size:24px;width:46px;height:46px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--well);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s,box-shadow .2s}
.av.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,208,46,.35),0 0 18px -4px var(--gold);transform:scale(1.06)}
.note{font-size:14px;color:var(--muted);margin:0;text-align:center}
.note.l{text-align:left}

/* lobby */
.bigcode{font-family:var(--f-num);font-size:52px;letter-spacing:.2em;color:#fffbe6;text-align:center;margin:6px 0;text-shadow:0 0 6px #fff,0 0 20px var(--gold),0 0 44px rgba(255,208,46,.6)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.pp{display:flex;align-items:center;gap:6px;background:var(--well);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-width:0;animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
.pp .e{font-size:22px}
.pp .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pp.host{border-color:rgba(255,208,46,.4)}
.pp.host::after{content:"房主";font-size:11px;color:var(--night);background:var(--gold);border-radius:6px;padding:0 6px;margin-left:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line2);border-radius:var(--r-md);padding:12px 14px;background:var(--well);cursor:pointer;text-align:left;color:var(--text);transition:box-shadow .2s,border-color .2s}
.opt b{display:block;font-size:17px;margin-bottom:2px}
.opt small{color:var(--muted);font-size:13px;line-height:1.4;display:block}
.opt.on{border-color:var(--S);box-shadow:0 0 0 1px var(--S),0 0 26px -8px var(--S);background:linear-gradient(180deg,rgba(255,61,127,.14),var(--well))}
.opt:disabled{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tg{border:1px solid var(--line2);border-radius:999px;padding:6px 14px;background:var(--well);cursor:pointer;font-size:15px;color:var(--muted);transition:all .15s}
.tg.on{color:var(--night);background:var(--C);border-color:var(--C);box-shadow:0 0 16px -6px var(--C)}
.tg:disabled{cursor:default}
.ppl{display:grid;grid-template-columns:48px 1fr 40px;gap:8px;align-items:center}
.x{border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--soft);height:44px}
.x:disabled{opacity:.3}

/* round chrome */
.roundbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.roundbar .sp{flex:1}
.timer{position:relative;height:30px;border-radius:999px;background:var(--well);border:1px solid var(--line);overflow:hidden}
.timer i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--C),var(--D));transition:width .25s linear;box-shadow:0 0 18px var(--C)}
.timer span{position:relative;display:block;text-align:center;font-family:var(--f-num);line-height:28px;color:var(--night);mix-blend-mode:normal;text-shadow:0 0 6px rgba(255,255,255,.6)}
.timer.hurry i{background:linear-gradient(90deg,var(--miss),var(--A));box-shadow:0 0 18px var(--miss)}
.timer.hurry{animation:pulse .5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
/* topic lightbox */
.topic{text-align:center;position:relative;padding:20px 18px;background:var(--box);color:var(--ink);border:0;box-shadow:0 0 0 1px rgba(255,255,255,.6),0 0 40px -6px rgba(255,61,127,.55),0 0 90px -20px rgba(255,61,127,.5)}
.topic small{font-size:13px;color:var(--boxmuted);letter-spacing:.12em}
.topic h2{font-size:clamp(25px,7.4vw,34px);margin:4px 0 0;color:var(--ink)}
.topic .by{display:block;margin-top:6px;font-size:13px;color:var(--boxmuted)}
.role{text-align:center;margin:0;font-size:17px;color:var(--muted)}
.role b{color:var(--gold)}

/* tier rows — unlit tubes that light up */
.tiers{display:flex;flex-direction:column;gap:10px}
.tier{--c:var(--S);position:relative;display:grid;grid-template-columns:64px 1fr auto;min-height:66px;border-radius:var(--r-md);background:var(--well);border:1px solid var(--line);transition:border-color .3s,box-shadow .3s,background .3s}
.tier.t0{--c:var(--S)}.tier.t1{--c:var(--A)}.tier.t2{--c:var(--B)}.tier.t3{--c:var(--C)}.tier.t4{--c:var(--D)}
.tl{font-family:var(--f-tier);font-size:32px;display:grid;place-items:center;color:var(--c);opacity:.28;border-right:1px solid var(--line);font-weight:400;transition:opacity .3s,text-shadow .3s}
.tl.t0{--c:var(--S)}.tl.t1{--c:var(--A)}.tl.t2{--c:var(--B)}.tl.t3{--c:var(--C)}.tl.t4{--c:var(--D)}
.tier.lit{border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent),0 0 26px -10px var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,var(--well)),var(--well) 60%)}
.tier.lit .tl{opacity:1;text-shadow:0 0 6px var(--c),0 0 18px var(--c)}
.slot{display:flex;align-items:center;gap:8px;padding:9px 10px;min-width:0;flex-wrap:wrap}
.slot .ph{color:var(--soft);font-size:14px}
.tier.tap{cursor:pointer}
.tier.tgt{border-style:dashed;border-color:var(--gold)}
.betbtn{align-self:center;margin-right:8px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:transparent;font-size:18px;cursor:pointer;filter:grayscale(1);opacity:.5;transition:all .2s}
.betbtn.on{filter:none;opacity:1;border-color:var(--A);box-shadow:0 0 18px -4px var(--A);background:rgba(255,138,43,.15);animation:jig .6s ease-in-out 2}
.tier.betrow{box-shadow:0 0 0 2px rgba(255,138,43,.6),0 0 30px -8px var(--A)}
.chip{border:0;border-radius:var(--r-sm);background:var(--box);color:var(--ink);padding:9px 15px;font-size:18px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.35),0 8px 20px -10px rgba(0,0,0,.7);line-height:1.3;max-width:100%;overflow-wrap:anywhere;text-align:left;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.placed{animation:popin .3s cubic-bezier(.3,1.7,.5,1)}
.chip.sel{background:var(--gold);animation:jig .5s ease-in-out infinite;box-shadow:0 0 22px -4px var(--gold)}
@keyframes jig{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:58px;padding:6px 0}
.pool .chip{font-size:19px;padding:11px 18px}
.hint{font-size:13px;color:var(--soft);text-align:center;margin:0}
.hint.bet{color:var(--A)}
.status{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.st{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.st.ok{border-color:rgba(46,230,160,.5);color:var(--C);box-shadow:0 0 14px -6px var(--C)}
.st.think{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}

/* handoff */
.hand{text-align:center;padding:30px 18px}
.hand .face{font-size:88px;line-height:1;display:inline-block;margin-bottom:14px;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.hand h2{font-size:34px;margin:6px 0 8px}

/* reveal */
.rvhead{text-align:center}
.rvhead .who{font-size:20px;margin:0}
.rvhead .who b{color:var(--gold)}
.tier.rv{min-height:72px}
.tier.hide .slot{justify-content:center}
.tier .q{font-family:var(--f-tier);font-size:26px;color:var(--soft);animation:shake 1.4s ease-in-out infinite}
@keyframes shake{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:none}}
.tier.fresh{animation:ignite .9s ease-out}
.tier.fresh .tl{animation:flicker 1s linear 1}
.tier.fresh.climax{animation:ignite 1.4s ease-out}
@keyframes ignite{0%{transform:scale(1.06);filter:brightness(2.2)}25%{filter:brightness(.7)}40%{filter:brightness(1.8)}100%{transform:none;filter:none}}
.tier.allhit{background:linear-gradient(90deg,rgba(46,230,160,.22),var(--well) 70%)}
.tier.nohit{background:linear-gradient(90deg,rgba(255,84,112,.18),var(--well) 70%)}
.chip.big{font-size:20px;cursor:default}
.fresh .chip.big{animation:dropin .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes dropin{0%{transform:translateY(-40px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.bubs{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.bub{position:relative;display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 10px 2px 4px;font-size:13px;color:var(--ink);max-width:100%}
.bub i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:7.5em}
.bub .e{font-size:17px}
.bub.hit{background:var(--hit);box-shadow:0 0 14px -4px var(--hit)}
.bub.near{background:var(--near)}
.bub.miss{background:#3a2f5c;color:var(--muted)}
.bub.bet{outline:2px solid var(--A);outline-offset:1px}
.bub .fire{font-size:14px;margin-left:2px}
.fresh .bub{animation:popin .4s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--d) + .4s)}
.stamp{position:absolute;right:10px;top:-13px;font-size:15px;padding:2px 12px;border-radius:10px;transform:rotate(5deg);background:var(--box);color:var(--ink);white-space:nowrap;box-shadow:0 6px 16px -6px rgba(0,0,0,.7)}
.stamp.good{background:var(--C);box-shadow:0 0 20px -4px var(--C)}
.stamp.bad{background:var(--miss);color:#fff;box-shadow:0 0 20px -4px var(--miss)}
.fresh .stamp{animation:stampin .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.75s}
@keyframes stampin{0%{transform:rotate(-20deg) scale(2.6);opacity:0}100%{transform:rotate(5deg) scale(1);opacity:1}}
@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.cnt{font-size:12px;color:var(--muted);margin-left:2px}

/* round result */
.res{display:flex;flex-direction:column;gap:12px;animation:popin .45s cubic-bezier(.3,1.5,.5,1)}
.banner{font-size:clamp(28px,8.4vw,38px);text-align:center;margin:0;color:#fff;text-shadow:0 0 18px rgba(255,61,127,.7);animation:boom .6s cubic-bezier(.2,1.7,.4,1)}
@keyframes boom{0%{transform:scale(.2) rotate(-10deg)}100%{transform:none}}
.x2tag{margin:0;text-align:center;color:var(--gold);font-family:var(--f-num);letter-spacing:.06em;font-size:14px}
.quip{text-align:center;margin:0;color:var(--muted);font-size:16px}
.sur{margin:0;padding:10px 14px;border-radius:var(--r-md);background:var(--well);border:1px dashed var(--line2);font-size:15px;text-align:center}
.sur b{font-family:var(--f-tier);font-size:18px}
.tc0{color:var(--S)}.tc1{color:var(--A)}.tc2{color:var(--B)}.tc3{color:var(--C)}.tc4{color:var(--D)}
.line{display:grid;grid-template-columns:34px minmax(0,1fr) 58px;gap:10px;align-items:center}
.line .e{font-size:24px}
.line .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--well);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--C);width:0;transition:width 1.1s cubic-bezier(.2,.9,.3,1);box-shadow:0 0 12px var(--C)}
.pts{font-family:var(--f-num);font-size:20px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
.badge{display:inline-block;font-size:12px;background:var(--S);color:#fff;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.badge.fireb{background:var(--A);color:var(--ink)}
.badge.lose{background:#3a2f5c;color:var(--muted)}
.board{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:30px 30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;border-radius:var(--r-sm);background:var(--well)}
.brow .rk{font-family:var(--f-num);text-align:center;color:var(--muted)}
.brow .sc{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.brow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ 音效（WebAudio 合成）============ */
let AC = null, MUTED = LS.get('xyp.mute', false);
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;
}
function tone(f, dur, type='sine', vol=.18, when=0, slide=0){
  const c=ac(); if(!c||MUTED) return;
  const t=c.currentTime+when, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide), t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(dur, vol=.15, when=0, freq=1200, q=.8){
  const c=ac(); if(!c||MUTED) return;
  const t=c.currentTime+when, len=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  f.type='bandpass'; f.frequency.value=freq; f.Q.value=q; g.gain.value=vol;
  s.buffer=b; s.connect(f).connect(g).connect(c.destination); s.start(t);
}

const CF = { parts:[], raf:0 };
function confetti(x=innerWidth/2, y=innerHeight/3, n=90, spread=1){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#ff4d7d','#ff9433','#ffd23a','#33d597','#46c1f4','#fff7fb'];
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(4+Math.random()*9)*spread;
    CF.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:6+Math.random()*7,h:4+Math.random()*5,c:pick(cols),life:110+Math.random()*60}); }
  if(!CF.raf) CF.raf=requestAnimationFrame(cfLoop);
}
function cfLoop(){
  const cv=$('#cf'), ctx=cv.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1);
  if(cv.width!==innerWidth*dpr){ cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  CF.parts=CF.parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  for(const p of CF.parts){ p.vy+=.28; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=Math.min(1,p.life/30); ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); }
  CF.raf = CF.parts.length ? requestAnimationFrame(cfLoop) : 0;
  if(!CF.raf) ctx.clearRect(0,0,innerWidth,innerHeight);
}

// G = 公開狀態；H = 只在執行者手上的秘密（大家送出的排名）
function newGame(pl, o){
  const n=pl.length;
  return { v:0, mode:o.mode, pl:pl.map(p=>({p:p.p,n:p.n,a:p.a})), ri:-1,
    tot: o.mode==='guess' ? n*o.per : o.rounds, ph:'rank', rid:'', star:-1, topic:null, done:[], rr:0,
    sc:Array(n).fill(0), st:pl.map(()=>[0,0,0,0,0,0,0,0,0]), pr:{}, streak:0, best:0, syncs:0,
    cats:o.cats, time:o.time||0, res:null, step:0, ms:0, aw:null, off:[], x2:false };
}
const newH = customs => ({ subs:{}, bets:{}, used:new Set(), customs:customs||[] });
const activeSeats = G => G.pl.map((_,i)=>i).filter(i=>!G.off.includes(i));
function pickTopic(G,H){
  const act=activeSeats(G);
  if(G.mode==='sync' && act.length>=3 && Math.random()<.35){
    let pool=NAME_PROMPTS.filter(t=>!H.used.has('n:'+t)); if(!pool.length) pool=NAME_PROMPTS;
    const t=pick(pool); H.used.add('n:'+t);
    return { t, w:shuffle(act.map(i=>G.pl[i].a+' '+G.pl[i].n)).slice(0,5), c:'name' };
  }
  const freshC=H.customs.filter(p=>!H.used.has('c:'+p.t));
  let p;
  if(freshC.length && Math.random()<.4){ p=pick(freshC); H.used.add('c:'+p.t); p={...p,c:'my'}; }
  else{
    let pool=PROMPTS.filter(p=>G.cats.includes(p.c)); if(!pool.length) pool=PROMPTS;
    let fresh=pool.filter(p=>!H.used.has(p.t)); if(!fresh.length){ pool.forEach(p=>H.used.delete(p.t)); fresh=pool; }
    p=pick(fresh); H.used.add(p.t);
  }
  return { t:p.t, w:shuffle(p.w).slice(0,5), c:p.c, by:p.by||'' };
}
function freshRound(G,H){ G.rid=rid(); G.done=[]; H.subs={}; H.bets={}; ENG.dl = G.time ? Date.now()+G.time*1000 : 0; }
function startRound(G,H){
  G.ri++; G.res=null; G.step=0; G.rr=0;
  const act=activeSeats(G);
  if(G.ri>=G.tot || act.length<2){ endGame(G); return; }
  G.star = G.mode==='guess' ? act[G.ri % act.length] : -1;
  G.x2 = G.tot>=3 && G.ri===G.tot-1;
  G.topic = pickTopic(G,H); G.ph='rank'; freshRound(G,H);
}
function reroll(G,H){ if(G.ph!=='rank'||G.rr>=2) return; G.topic=pickTopic(G,H); G.rr++; freshRound(G,H); }
function submit(G,H,seat,k,b){
  if(G.ph!=='rank' || !Array.isArray(k)) return false;
  const K=G.topic.w.length;
  if(k.length!==K || [...k].sort((a,b)=>a-b).some((v,i)=>v!==i)) return false;
  if(G.off.includes(seat) || seat<0 || seat>=G.pl.length) return false;
  H.subs[seat]=k.slice();
  H.bets[seat] = (G.mode==='guess' && seat!==G.star && Number.isInteger(b) && b>=0 && b<K) ? b : -1;
  G.done=Object.keys(H.subs).map(Number); return true;
}
const allIn = (G,H) => G.ph==='rank' && activeSeats(G).every(s=>H.subs[s]);
const canForce = (G,H) => G.ph==='rank' && (G.mode==='guess' ? (H.subs[G.star] && Object.keys(H.subs).length>=2) : Object.keys(H.subs).length>=2);
function doReveal(G,H){
  const K=G.topic.w.length, subs={}; Object.keys(H.subs).forEach(s=>subs[s]=H.subs[s]);
  const seats=Object.keys(subs).map(Number), T={}; seats.forEach(s=>T[s]=tierOf(subs[s]));
  const mult=G.x2?2:1;
  const res={ k:subs, pts:{}, perf:[], sp:0, max:2*K+5, bet:{}, sur:null, x2:G.x2 };
  if(seats.length>=3) seats.forEach(s=>{ let d=0; for(let w=0;w<K;w++){ let m=0; seats.forEach(o=>{ if(o!==s) m+=T[o][w]; }); m/=seats.length-1; d+=Math.abs(T[s][w]-m); } G.st[s][5]=r1(G.st[s][5]+d/K); G.st[s][6]++; });
  if(G.mode==='guess'){
    const S=G.star, gs=seats.filter(s=>s!==S); let sum=0;
    gs.forEach(s=>{ let p=0, ex=0; for(let w=0;w<K;w++){ const d=Math.abs(T[s][w]-T[S][w]); if(!d){p+=2;ex++;} else if(d===1) p+=1; }
      if(ex===K){ p+=5; res.perf.push(s); }
      const b=H.bets[s]; if(b>=0){ const hit=subs[s][b]===subs[S][b]; res.bet[s]=[b,hit?1:0]; p+=hit?3:-1; G.st[s][7]++; if(hit) G.st[s][8]++; }
      p=Math.max(0,p)*mult;
      res.pts[s]=p; sum+=p; G.sc[s]+=p; const st=G.st[s]; st[0]+=p; st[1]++; if(ex===K) st[2]++;
      const key=s+'>'+S, pr=G.pr[key]||(G.pr[key]=[0,0]); pr[0]+=p/mult; pr[1]++; });
    const avg=gs.length?sum/gs.length:0; res.sp=Math.round(avg); res.avg=r1(avg/mult); G.sc[S]+=res.sp; G.st[S][3]=r1(G.st[S][3]+avg/mult); G.st[S][4]++;
    // 最大驚嚇：大家平均猜得最遠的詞
    if(gs.length){ let bw=-1, bd=0; for(let w=0;w<K;w++){ let d=0; gs.forEach(s=>d+=Math.abs(T[s][w]-T[S][w])); d/=gs.length; if(d>bd){ bd=d; bw=w; } }
      if(bw>=0 && bd>=1.5){ const c={}; gs.forEach(s=>c[T[s][bw]]=(c[T[s][bw]]||0)+1); const gt=+Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]; res.sur={w:bw, st:T[S][bw], gt}; } }
  } else {
    const same=seats.every(s=>subs[s].join()===subs[seats[0]].join());
    res.same=same; if(same){ G.streak++; G.syncs++; G.best=Math.max(G.best,G.streak); } else G.streak=0;
    for(let i=0;i<seats.length;i++) for(let j=i+1;j<seats.length;j++){ const a=seats[i], b=seats[j]; let d=0; for(let w=0;w<K;w++) d+=Math.abs(T[a][w]-T[b][w]); const key=a+'-'+b, pr=G.pr[key]||(G.pr[key]=[0,0]); pr[0]=r1(pr[0]+d/K); pr[1]++; }
    seats.forEach(s=>{ let p=0; for(let t=0;t<K;t++) seats.forEach(o=>{ if(o!==s && subs[o][t]===subs[s][t]) p++; }); if(same) p+=3; p*=mult; res.pts[s]=p; G.sc[s]+=p; });
    if(!same){ let bw=-1, bd=0; for(let w=0;w<K;w++){ const ts=seats.map(s=>T[s][w]), d=Math.max(...ts)-Math.min(...ts); if(d>bd){ bd=d; bw=w; } }
      if(bw>=0 && bd>=2){ const ts=seats.map(s=>T[s][bw]); res.sur={w:bw, lo:Math.min(...ts), hi:Math.max(...ts)}; } }
  }
  G.res=res; G.ph='reveal'; G.step=0; G.ms=K+1;
}
function endGame(G){ G.ph='end'; G.aw=computeAwards(G); }
function computeAwards(G){
  const n=G.pl.length, A=[], st=G.st;
  const best=(f,dir)=>{ let b=null, s=[]; for(let i=0;i<n;i++){ const v=f(i); if(v==null) continue; if(b==null || (v-b)*dir>0){ b=v; s=[i]; } else if(v===b) s.push(i); } return b==null?null:{v:b,s}; };
  const champ=best(i=>G.sc[i],1);
  if(G.mode==='guess'){
    if(champ) A.push({i:'👑',t:'全場最會讀心',d:`總分 ${champ.v} 分`,s:champ.s});
    const det=best(i=>st[i][1]?r1(st[i][0]/st[i][1]):null,1); if(det) A.push({i:'🔍',t:'名偵探',d:`猜別人平均每回合拿 ${det.v} 分`,s:det.s});
    const easy=best(i=>st[i][4]?r1(st[i][3]/st[i][4]):null,1), myst=best(i=>st[i][4]?r1(st[i][3]/st[i][4]):null,-1);
    if(easy) A.push({i:'📖',t:'一秒看穿',d:`大家猜他平均拿 ${easy.v} 分，根本透明人`,s:easy.s});
    if(myst && easy && myst.v!==easy.v) A.push({i:'🌫️',t:'謎一樣的人',d:`大家猜他平均只拿 ${myst.v} 分`,s:myst.s});
    const pf=best(i=>st[i][2]||null,1); if(pf) A.push({i:'🧠',t:'讀心術大師',d:`完美猜中 ${pf.v} 次`,s:pf.s});
    let bp=null; for(let a=0;a<n;a++) for(let b=a+1;b<n;b++){ const x=G.pr[a+'>'+b], y=G.pr[b+'>'+a]; if(x&&y){ const v=(x[0]/x[1]+y[0]/y[1])/2; if(!bp||v>bp.v) bp={v,s:[a,b]}; } }
    if(bp) A.push({i:'💞',t:'靈魂伴侶',d:`互猜平均 ${r1(bp.v)} 分`,s:bp.s});
    const gam=best(i=>st[i][8]||null,1); if(gam) A.push({i:'🎰',t:'賭神',d:`🔥 押注押中 ${gam.v} 次`,s:gam.s});
  } else {
    A.push({i:'🔥',t:'全員神同步',d:`${G.syncs} / ${G.tot} 回合完全一致，最高連續 ${G.best} 回合`,s:[]});
    if(champ) A.push({i:'🤝',t:'最合拍的人',d:`和大家撞排 ${champ.v} 分`,s:champ.s});
    let bp=null; for(const k in G.pr){ const [a,b]=k.split('-').map(Number), v=G.pr[k][0]/G.pr[k][1]; if(!bp||v<bp.v) bp={v,s:[a,b]}; }
    if(bp) A.push({i:'💞',t:'腦波最像',d:`兩人的排法幾乎一樣`,s:bp.s});
  }
  const con=best(i=>st[i][6]?r1(st[i][5]/st[i][6]):null,1);
  if(con && con.v>0) A.push({i:'🙃',t:'唱反調王',d:'排法最常跟大家不一樣',s:con.s});
  return A;
}

/* 自架伺服器的連線（Render 版）：提供跟 claude.ai room 一樣的介面 */
function wsRoomProvider(){
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  return { join: name => new Promise((resolve,reject)=>{
    const R={ peers:new Map(), me:null, tok:null, ls:[], cs:[], mine:{}, ws:null, ok:false, closed:false, first:true, tries:0 };
    try{ const saved=JSON.parse(sessionStorage.getItem('xyp.ws.'+name)||'null'); if(saved){ R.me=saved.peer; R.tok=saved.tok; } }catch(e){}
    const snap=()=>[...R.peers.entries()].map(([peer,pr])=>({peer,presence:pr,sameTab:peer===R.me,isMe:peer===R.me,by:null,kind:'viewer',guest:false,updatedAt:0}));
    const fire=(j,u,l)=>{ const ps=snap(), f=a=>a.map(p=>ps.find(x=>x.peer===p)).filter(Boolean); R.ls.forEach(h=>{ try{ h({peers:ps,joined:f(j),left:l||[],updated:f(u)}); }catch(e){ console.error(e); } }); };
    const send=m=>{ if(R.ok && R.ws.readyState===1) R.ws.send(JSON.stringify(m)); };
    const api={ name,
      presence: async patch=>{ R.mine={...R.mine,...patch}; for(const k in patch) if(patch[k]===null) delete R.mine[k]; if(R.me) R.peers.set(R.me,R.mine); send({t:'pr',patch}); if(R.me) fire([],[R.me]); },
      peers: ()=>snap(),
      onPeers: h=>{ R.ls.push(h); setTimeout(()=>fire([...R.peers.keys()],[]),0); return ()=>{ R.ls=R.ls.filter(x=>x!==h); }; },
      connected: ()=>R.ok,
      onConnection: h=>{ R.cs.push(h); setTimeout(()=>h(R.ok),0); return ()=>{ R.cs=R.cs.filter(x=>x!==h); }; },
      leave: async()=>{ R.closed=true; try{ sessionStorage.removeItem('xyp.ws.'+name); }catch(e){} try{ R.ws.send(JSON.stringify({t:'leave'})); R.ws.close(); }catch(e){} },
      emit: async()=>{}, on: ()=>()=>{}
    };
    function connect(){
      let ws; try{ ws=new WebSocket(url); }catch(e){ reject({code:'upstream_error'}); return; }
      R.ws=ws;
      ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:name,peer:R.me,tok:R.tok,pr:R.mine}));
      ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(x){ return; }
        if(m.t==='welcome'){
          R.me=m.peer; R.tok=m.tok; R.ok=true; R.tries=0;
          try{ sessionStorage.setItem('xyp.ws.'+name, JSON.stringify({peer:R.me,tok:R.tok})); }catch(x){}
          R.peers=new Map(m.peers.map(p=>[p.peer,p.pr])); R.peers.set(R.me,R.mine);
          R.cs.forEach(h=>h(true));
          if(R.first){ R.first=false; resolve(api); }
          fire([...R.peers.keys()],[]);
        } else if(m.t==='pr'){ const j=!R.peers.has(m.peer); R.peers.set(m.peer,m.pr||{}); fire(j?[m.peer]:[], j?[]:[m.peer]); }
        else if(m.t==='left'){ if(R.peers.has(m.peer)){ const old={peer:m.peer,presence:R.peers.get(m.peer)}; R.peers.delete(m.peer); fire([],[],[old]); } }
      };
      ws.onclose=()=>{ const was=R.ok; R.ok=false; if(was) R.cs.forEach(h=>h(false));
        if(R.first){ R.first=false; reject({code:'upstream_error'}); return; }
        if(!R.closed){ R.tries++; setTimeout(connect, Math.min(5000, 600*R.tries)); } };
    }
    connect();
  }) };
}

      const cnt={}; seats.forEach(s=>{ const w=R.k[s][t]; cnt[w]=(cnt[w]||0)+1; });
      const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0], same=top[1]===seats.length;
      slot=`<span class="chip big">${esc(W[top[0]])}</span><span class="cnt">${top[1]}/${seats.length}</span>`;
      bubs=seats.map((s,j)=>{ const gw=R.k[s][t]; return `<span class="bub ${String(gw)===top[0]?'hit':'miss'}" style="--d:${j*110}ms"><span class="e">${esc(G.pl[s].a)}</span><i>${esc(W[gw])}</i></span>`; }).join('');
      stamp = same ? `<span class="stamp good">同！</span>` : `<span class="stamp bad">分歧！</span>`; cls = same?'allhit':'';
    }
    h+=`<div class="tier t${t} rv lit ${fresh?'fresh':''} ${t===0?'climax':''} ${cls}">${tl(t)}<div class="slot">${slot}<div class="bubs">${bubs}</div></div>${stamp}</div>`;
  }
  h+='</div>';
  if(G.step>=G.ms) h+=vRoundResult(G);
  else if(canControl()) h+=`<button class="btn ghost small" data-act="skip">快轉 ▶</button>`;
  h+=vRx();
  return h;
}
const QUIPS = {
  perfect:['完美讀心！你住在他腦袋裡嗎？','神同步！這已經不是猜，是預言','根本是同一個人吧？'],
  easy:['一眼看穿，透明人無誤','太好懂了，下次藏深一點','大家都很懂你喔 😏'],
  mid:['有懂有不懂，剛剛好','還算有默契！','差一點就心有靈排了'],
  hard:['這位主角太神祕了吧！','原來大家都不認識你…','你的腦袋是迷宮嗎？']
};
function vRoundResult(G){
  const R=G.res, me=mySeat();
  const board=G.pl.map((p,i)=>({i,s:G.sc[i]})).sort((a,b)=>b.s-a.s);
  const boardH=`<div class="board">${board.map((b,r)=>`<div class="brow ${b.i===me&&CUR.online?'me':''}"><span class="rk">${r+1}</span><span>${esc(G.pl[b.i].a)}</span><span class="nm">${esc(G.pl[b.i].n)}</span><span class="sc">${b.s}</span></div>`).join('')}</div>`;
  let h='<div class="card res">';
  if(G.mode==='guess'){
    const gs=Object.keys(R.pts).map(Number).sort((a,b)=>R.pts[b]-R.pts[a]);
    const pct=R.max?Math.round(R.avg/R.max*100):0;
    const q=R.perf.length?QUIPS.perfect:pct>=60?QUIPS.easy:pct>=35?QUIPS.mid:QUIPS.hard;
    h+=`${R.x2?'<p class="x2tag">決勝回合 分數 ×2</p>':''}<p class="banner">${R.perf.length?'🎉 完美讀心！':pct>=60?'😎 默契滿點':pct>=35?'🙂 還不錯':'🤯 謎之主角'}</p><p class="quip">${esc(seededPick(q,G.rid))}</p>
    <div class="line"><span class="e">${esc(G.pl[G.star].a)}</span><div><div class="nm">${esc(G.pl[G.star].n)}（主角）被讀懂度 ${pct}%</div><div class="bar"><i data-w="${pct}" style="background:var(--S)"></i></div></div><span class="pts">+${R.sp}</span></div>
    ${R.sur?`<p class="sur">😱 最大驚嚇：大家以為「${esc(G.topic.w[R.sur.w])}」在 <b class="tc${R.sur.gt}">${TIERS[R.sur.gt]}</b>，結果在 <b class="tc${R.sur.st}">${TIERS[R.sur.st]}</b>！</p>`:''}
    ${gs.map(s=>`<div class="line"><span class="e">${esc(G.pl[s].a)}</span><div><div class="nm">${esc(G.pl[s].n)}${R.perf.includes(s)?'<span class="badge">完美 +5</span>':''}${R.bet&&R.bet[s]?(R.bet[s][1]?'<span class="badge fireb">🔥押中 +3</span>':'<span class="badge lose">🔥押錯 −1</span>'):''}</div><div class="bar"><i data-w="${Math.round(R.pts[s]/R.max*100)}"></i></div></div><span class="pts">+${R.pts[s]}</span></div>`).join('')}`;
  } else {
    const K=G.topic.w.length, seats=Object.keys(R.k).map(Number);
    let sameT=0; for(let t=0;t<K;t++) if(seats.every(s=>R.k[s][t]===R.k[seats[0]][t])) sameT++;
    h+=`<p class="banner">${R.same?`🔥 全員神同步！`:sameT>=K-1?'😭 只差一點點！':'💥 破功！'}</p><p class="quip">${R.same?`連續同步 ${G.streak} 回合（最高 ${G.best}）`:`${sameT} / ${K} 列完全一致${G.best?`　最高連續 ${G.best} 回合`:''}`}</p>${R.sur?`<p class="sur">💥 最大分歧：「${esc(G.topic.w[R.sur.w])}」有人放 <b class="tc${R.sur.lo}">${TIERS[R.sur.lo]}</b>，有人放 <b class="tc${R.sur.hi}">${TIERS[R.sur.hi]}</b></p>`:''}`;
  }
  h+=`<h3 style="margin-top:6px">目前排名</h3>${boardH}</div>`;
  const last=G.ri+1>=G.tot;
  if(canControl()) h+=`<button class="btn big pink" data-act="next">${last?'🏆 看頒獎！':'下一回合 →'}</button>`;
  else h+=`<p class="note">等房主按下一回合…</p>`;
  return h;
}
function seededPick(arr,seed){ let h=0; for(const c of String(seed)) h=(h*31+c.charCodeAt(0))|0; return arr[Math.abs(h)%arr.length]; }
function vRx(){ return `<div class="rx" role="group" aria-label="表情反應">${REACTS.map(e=>`<button data-act="rx" data-e="${e}" aria-label="送出 ${e}">${e}</button>`).join('')}</div>`; }
function vEnd(G){
  const aw=G.aw||[], n=Math.min(UI.awStep, aw.length), me=mySeat();
  let h=`<div class="hero" style="padding-top:4px"><h1 class="logo" style="font-size:40px">頒獎典禮</h1><p class="tag">${G.mode==='guess'?'誰最懂誰？':'你們有多同步？'}</p></div><div class="stack">`;
  for(let i=0;i<n;i++){ const a=aw[i]; h+=`<div class="card aw"><span class="ic">${a.i}</span><div><h3>${esc(a.t)}</h3>${a.s.length?`<div class="who">${a.s.map(s=>esc(pname(G,s))).join('、')}</div>`:''}<p>${esc(a.d)}</p></div></div>`; }
  if(UI.awStep<aw.length) h+=`<p class="drum">🥁 下一個獎項是…</p>`;
  h+='</div>';
  if(UI.awStep>=aw.length){
    const board=G.pl.map((p,i)=>({i,s:G.sc[i]})).sort((a,b)=>b.s-a.s), med=['🥇','🥈','🥉'];
    h+=`<div class="card stack"><h3>最終排名</h3><div class="board">${board.map((b,r)=>`<div class="brow ${b.i===me&&CUR.online?'me':''}"><span class="rk">${med[r]||r+1}</span><span>${esc(G.pl[b.i].a)}</span><span class="nm">${esc(G.pl[b.i].n)}</span><span class="sc">${b.s}</span></div>`).join('')}</div></div>`;
    if(canControl()) h+=`<button class="btn big pink" data-act="again">再玩一場！</button>`; else h+=`<p class="note">等房主開下一場…</p>`;
    h+=`<button class="btn ghost" data-act="${CUR.online?'leave':'home'}">回首頁</button>`;
  } else h+=`<button class="btn ghost small" data-act="awskip">直接看全部 ▶</button>`;
  return h+vRx();
}

/* ============ render ============ */
let lastHTML='';
function render(){
  let h='';
  switch(UI.scr){
    case 'home': h=vHome(); break;
    case 'lobby': h=vLobby(); break;
    case 'pp': h=vPP(); break;
    case 'custom': h=vCustom(); break;
    case 'help': h=vHelp(); break;
    case 'game': h=vGame(); break;
  }
  h=vTop()+h;
  if(h===lastHTML) return;
  const app=$('#app'), ae=document.activeElement, fid=ae&&ae.id&&app.contains(ae)?ae.id:null, ss=fid&&ae.selectionStart, se=fid&&ae.selectionEnd;
  app.innerHTML=h; lastHTML=h;
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ el.setSelectionRange(ss,se); }catch(e){} } }
  if(CUR.G && CUR.G.ph==='reveal' && CUR.G.step>=CUR.G.ms) requestAnimationFrame(()=>document.querySelectorAll('.bar i[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'));
}
function focusLater(sel){ setTimeout(()=>{ const e=$(sel); e&&e.focus(); },30); }

/* ============ 互動 ============ */
function go(scr){ UI.scr=scr; UI.err=''; scrollTo(0,0); render(); }
function myAction(kind, payload){
  const G=CUR.G; if(!G) return;
  if(!CUR.online || NET.isHost){
    const E=ENG.G; if(!E) return;
    if(kind==='submit'){ if(submit(E,ENG.H,payload.seat,payload.k,payload.b)){ if(!CUR.online) UI.ppTurn=null; engCommit(); } }
    else if(kind==='reroll'){ reroll(E,ENG.H); engCommit(); }
    else if(kind==='next'){ if(E.ph==='reveal'){ startRound(E,ENG.H); engCommit(); } }
    else if(kind==='skip'){ if(E.ph==='reveal' && E.step<E.ms){ E.step++; engCommit(); } }
    else if(kind==='force'){ if(canForce(E,ENG.H)){ doReveal(E,ENG.H); engCommit(); } }
    return;
  }
  if(kind==='submit'){ UI.sentRid=G.rid; NET.r.presence({ s:{ r:G.rid, k:payload.k, b:payload.b } }).catch(()=>{}); render(); }
  else if(kind==='reroll'){ UI.rqRid=G.rid; NET.r.presence({ rq:G.rid }).catch(()=>{}); render(); }
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  ac(); const a=b.dataset.act, G=CUR.G;
  switch(a){
    case 'home': if(UI.scr==='game' && CUR.online) return; if(UI.scr==='lobby' && NET.r) return; if(UI.scr==='game' && !CUR.online){ if(!UI.confirmHome){ UI.confirmHome=true; b.textContent='再點一次離開'; setTimeout(()=>UI.confirmHome=false,2000); return; } engStop(); CUR.G=null; } go('home'); break;
    case 'mute': MUTED=!MUTED; LS.set('xyp.mute',MUTED); render(); if(!MUTED) sfx('ding'); break;
    case 'av': ME.a=b.dataset.a; saveMe(); sfx('tap'); render(); break;
    case 'create': { const c=Array.from({length:4},()=>pick('ABCDEFGHJKMNPQRSTUVWXYZ23456789')).join(''); goOnline(true,c); break; }
    case 'join': { const c=(UI.code||'').trim().toUpperCase(); if(!/^[A-Z0-9]{4}$/.test(c)){ UI.err='房號是 4 個英文或數字'; render(); focusLater('#code'); return; } goOnline(false,c); break; }
    case 'leave': leaveRoom(); break;
    case 'invite': { const link=location.origin+location.pathname+'#'+NET.code; const done=()=>{ UI.copied=true; render(); setTimeout(()=>{ UI.copied=false; render(); },2000); }; try{ navigator.clipboard.writeText(link).then(done,()=>{ UI.err=link; render(); }); }catch(e){ UI.err=link; render(); } break; }
    case 'pp': UI.ppl=null; go('pp'); break;
    case 'custom': UI.cerr=''; go('custom'); break;
    case 'help': go('help'); break;
    case 'mode': SET.mode=b.dataset.v; saveSet(); sfx('tap'); render(); break;
    case 'per': SET.per=+b.dataset.v; saveSet(); sfx('tap'); render(); break;
    case 'rounds': SET.rounds=+b.dataset.v; saveSet(); sfx('tap'); render(); break;
    case 'cat': { const v=b.dataset.v, i=SET.cats.indexOf(v); if(i>=0){ if(SET.cats.length>1) SET.cats.splice(i,1); } else SET.cats.push(v); saveSet(); sfx('tap'); render(); break; }
    case 'start': if(NET.isHost) hostStart(); break;
    case 'ppav': { const p=UI.ppl[+b.dataset.i]; p.a=AVATARS[(AVATARS.indexOf(p.a)+1)%AVATARS.length]; sfx('tap'); render(); break; }
    case 'ppadd': if(UI.ppl.length<10){ const used=UI.ppl.map(p=>p.a); UI.ppl.push({n:'',a:AVATARS.find(x=>!used.includes(x))||pick(AVATARS)}); render(); focusLater('#ppn-'+(UI.ppl.length-1)); } break;
    case 'ppdel': if(UI.ppl.length>2){ UI.ppl.splice(+b.dataset.i,1); render(); } break;
    case 'ppstart': {
      const pl=UI.ppl.map((p,i)=>({p:'L'+i,n:p.n.trim().slice(0,8),a:p.a}));
      ENG.G=newGame(pl,SET); ENG.H=newH(CUSTOM.map(c=>({...c,by:''}))); startRound(ENG.G,ENG.H);
      CUR.online=false; UI.scr='game'; engCommit(); break;
    }
    case 'ppgo': UI.ppTurn=+b.dataset.s; UI.draft=null; sfx('tap'); scrollTo(0,0); render(); break;
    case 'word': { if(!G) return; const d=UI.draft, w=+b.dataset.w, t=d.arr.indexOf(-1); if(t<0) return; d.arr[t]=w; UI.sel=-1; sfx('place'); render(); break; }
    case 'placed': { const d=UI.draft, t=+b.dataset.t; if(UI.sel===t){ d.arr[t]=-1; if(d.bet===t) d.bet=-1; UI.sel=-1; sfx('back'); } else if(UI.sel>=0){ [d.arr[UI.sel],d.arr[t]]=[d.arr[t],d.arr[UI.sel]]; UI.sel=-1; sfx('place'); } else { UI.sel=t; sfx('tap'); } render(); break; }
    case 'tier': { const d=UI.draft, t=+b.dataset.t; if(!d) return; if(UI.sel>=0 && UI.sel!==t){ [d.arr[UI.sel],d.arr[t]]=[d.arr[t],d.arr[UI.sel]]; UI.sel=-1; sfx('place'); render(); } break; }
    case 'clear': if(UI.draft){ UI.draft.arr.fill(-1); UI.draft.bet=-1; UI.sel=-1; sfx('back'); render(); } break;
    case 'submit': { const d=UI.draft; if(!d || d.arr.some(x=>x<0)) return; sfx('send'); myAction('submit',{seat:d.seat,k:d.arr.slice(),b:d.bet}); break; }
    case 'bet': { const d=UI.draft, t=+b.dataset.t; if(!d) return; d.bet = d.bet===t ? -1 : t; sfx(d.bet>=0?'ding':'back'); render(); break; }
    case 'time': SET.time=+b.dataset.v; saveSet(); sfx('tap'); render(); break;
    case 'reroll': myAction('reroll'); break;
    case 'next': myAction('next'); break;
    case 'skip': myAction('skip'); break;
    case 'force': myAction('force'); break;
    case 'awskip': UI.awStep=99; clearInterval(UI.awT); sfx('fanfare'); confetti(); render(); break;
    case 'again': clearInterval(UI.awT); if(CUR.online) hostBackToLobby(); else { engStop(); CUR.G=null; go('pp'); } break;
    case 'rx': { const now=Date.now(); if(now-UI.lastRx<250) return; UI.lastRx=now; const em=b.dataset.e; floatEmoji(em); sfx('pop'); if(NET.r && CUR.online) NET.r.presence({ rx:{ e:em, t:now } }).catch(()=>{}); break; }
    case 'cadd': {
      const t=UI.ct.trim(), w=[...new Set(UI.cw.split(/[\n,，、]/).map(s=>s.trim().slice(0,16)).filter(Boolean))];
      if(!t){ UI.cerr='題目還沒填'; render(); return; }
      if(w.length<3||w.length>8){ UI.cerr=`詞語要 3–8 個，現在是 ${w.length} 個`; render(); return; }
      CUSTOM.unshift({t:t.slice(0,30),w}); LS.set('xyp.custom',CUSTOM); UI.ct=''; UI.cw=''; UI.cerr=''; sfx('cheer');
      if(NET.r) NET.r.presence({ my:myCustomsForPresence() }).catch(()=>{});
      render(); break;
    }
    case 'cdel': CUSTOM.splice(+b.dataset.i,1); LS.set('xyp.custom',CUSTOM); render(); break;
  }
});
document.addEventListener('input', e=>{
  const el=e.target, id=el.id; if(!id) return;
  if(id==='nm'){ ME.n=el.value.slice(0,8); saveMe(); if(UI.err) { UI.err=''; } }
  else if(id==='code'){ UI.code=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4); if(el.value!==UI.code) el.value=UI.code; }
  else if(id==='ct') UI.ct=el.value;
  else if(id==='cw') UI.cw=el.value;
  else if(id.startsWith('ppn-')){ const i=+id.slice(4); if(UI.ppl[i]) UI.ppl[i].n=el.value.slice(0,8); }
  // 只有會影響按鈕狀態時才重畫
  if(id.startsWith('ppn-')||id==='nm') render();
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='code'){ e.preventDefault(); document.querySelector('[data-act="join"]')?.click(); } });
(()=>{ const h=(location.hash||'').slice(1).toUpperCase(); if(/^[A-Z0-9]{4}$/.test(h)) UI.code=h; })();
render();
</script>
